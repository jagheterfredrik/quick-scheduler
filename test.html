<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>quick-scheduler test</title>
  </head>
  <body>
    <home-assistant></home-assistant>
    <div id="card"></div>
    <pre id="log"></pre>
    <script>
      // Fake hass that records service calls and serves a few schedules in
      // scheduler-component's websocket format.
      window.calls = [];
      const inHours = (h) => new Date(Date.now() + h * 3600000).toISOString();
      const slot = (service, entity_id) => ({
        start: "00:00",
        actions: [{ service, entity_id }],
      });
      window.schedules = [
        { entity_id: "switch.schedule_a1", repeat_type: "single", enabled: true,
          timeslots: [slot("lock.unlock", "lock.wallbox_lock")], timestamps: [inHours(26)] },
        { entity_id: "switch.schedule_b2", repeat_type: "single", enabled: true,
          timeslots: [slot("lock.lock", "lock.wallbox_lock")], timestamps: [inHours(2)] },
        { entity_id: "switch.schedule_c3", repeat_type: "repeat", enabled: true,
          timeslots: [slot("lock.lock", "lock.wallbox_lock")], timestamps: [inHours(5)] },
        { entity_id: "switch.schedule_d4", repeat_type: "repeat", enabled: false,
          timeslots: [slot("lock.unlock", "lock.wallbox_lock")], timestamps: [] },
        { entity_id: "switch.schedule_e5", repeat_type: "single", enabled: true,
          timeslots: [slot("light.turn_on", "light.kitchen")], timestamps: [inHours(1)] },
      ];
      document.querySelector("home-assistant").hass = {
        states: {
          "lock.wallbox_lock": { attributes: { friendly_name: "Wallbox Lock" } },
        },
        callWS: async (msg) => (msg.type === "scheduler" ? window.schedules : null),
        callService: async (domain, service, data) => {
          window.calls.push({ domain, service, data });
          if (service === "remove") {
            window.schedules = window.schedules.filter((s) => s.entity_id !== data.entity_id);
          }
          document.getElementById("log").textContent = JSON.stringify(
            window.calls,
            null,
            2
          );
        },
      };
      // Card with a shadow root, like a real Lovelace card.
      const card = document.getElementById("card");
      card._config = { entity: "lock.wallbox_lock" };
      const inner = document.createElement("button");
      inner.textContent = "Long-press me";
      card.attachShadow({ mode: "open" }).appendChild(inner);
      inner.addEventListener("click", () =>
        inner.dispatchEvent(
          new CustomEvent("ll-custom", {
            detail: { action: "fire-dom-event", quick_scheduler: true },
            bubbles: true,
            composed: true,
          })
        )
      );
    </script>
    <script type="module" src="./quick-scheduler.js"></script>
  </body>
